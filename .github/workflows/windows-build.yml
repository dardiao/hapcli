name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build hapcli for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        env:
          # 静态链接 VC++ 运行库：目标机器无需安装 VCRUNTIME140.dll
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release -p hapcli-egui-app

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/hapcli-egui-app.exe dist/hapcli.exe
          Compress-Archive -Path dist/hapcli.exe -DestinationPath hapcli-windows-x86_64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hapcli-windows-x86_64
          path: hapcli-windows-x86_64.zip

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          gh release upload $tag hapcli-windows-x86_64.zip --clobber
