[package]
name = "hapcli-plugin-host-api"
edition.workspace = true
version.workspace = true

[features]
default = []
wasm-runtime = ["dep:hapcli-plugin-wasm-runtime"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
hapcli-ai = { path = "../hapcli-ai" }
hapcli-connection-monitor = { path = "../hapcli-connection-monitor" }
hapcli-connections = { path = "../hapcli-connections" }
hapcli-ide-core = { path = "../hapcli-ide-core" }
hapcli-i18n = { path = "../hapcli-i18n" }
hapcli-forwarding = { path = "../hapcli-forwarding" }
hapcli-network-proxy = { path = "../hapcli-network-proxy" }
hapcli-plugin-manifest = { path = "../hapcli-plugin-manifest" }
hapcli-plugin-protocol = { path = "../hapcli-plugin-protocol" }
hapcli-plugin-registry = { path = "../hapcli-plugin-registry" }
hapcli-plugin-wasm-runtime = { path = "../hapcli-plugin-wasm-runtime", optional = true }
hapcli-settings = { path = "../hapcli-settings" }
hapcli-sftp = { path = "../hapcli-sftp" }
hapcli-ssh = { path = "../hapcli-ssh" }
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
wat = "1.250.0"
