hapcli-forwarding = { path = "../hapcli-forwarding", default-features = false }
hapcli-network-proxy = { path = "../hapcli-network-proxy" }
hapcli-portable-runtime = { path = "../hapcli-portable-runtime" }
hapcli-quick-commands = { path = "../hapcli-quick-commands" }
hapcli-secret-store = { path = "../hapcli-secret-store" }
hapcli-settings = { path = "../hapcli-settings" }
reqwest.workspace = true
